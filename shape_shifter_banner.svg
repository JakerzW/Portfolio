<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="40%" fy="50%">
      <stop offset="0%" stop-color="#161630"/>
      <stop offset="55%" stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#06060C"/>
    </radialGradient>

    <!-- Ambient Cyan / Magenta Neon Glow -->
    <radialGradient id="cyanAmbient" cx="72%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF2A85" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <!-- Polyomino Tile Gradients -->
    <linearGradient id="tileCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DFBDF"/>
      <stop offset="100%" stop-color="#00C4AA"/>
    </linearGradient>
    <linearGradient id="tileMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5CA1"/>
      <stop offset="100%" stop-color="#D41466"/>
    </linearGradient>
    <linearGradient id="tileYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF078"/>
      <stop offset="100%" stop-color="#E5C710"/>
    </linearGradient>
    <linearGradient id="tileOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="100%" stop-color="#D95300"/>
    </linearGradient>
    <linearGradient id="tilePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D838BF"/>
      <stop offset="100%" stop-color="#8E0E7B"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE01E"/>
      <stop offset="100%" stop-color="#2A8A00"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="boardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00F5D4" flood-opacity="0.25"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2A4E" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="600" fill="url(#bgGlow)"/>
  <rect width="1200" height="600" fill="url(#cyberGrid)"/>
  <rect width="1200" height="600" fill="url(#cyanAmbient)"/>

  <!-- LEFT: Title (Vertically Centered in Safe Zone) -->
  <g transform="translate(140, 240)">
    <text x="0" y="0" font-family="'Orbitron', 'Sora', sans-serif" font-size="82" font-weight="900" fill="url(#titleGrad)" letter-spacing="4" filter="url(#glowTitle)">SHAPE</text>
    <text x="0" y="96" font-family="'Orbitron', 'Sora', sans-serif" font-size="82" font-weight="900" fill="url(#titleGrad)" letter-spacing="4" filter="url(#glowTitle)">SHIFTER</text>
    <rect x="2" y="128" width="380" height="4" rx="2" fill="url(#titleGrad)" opacity="0.85"/>
  </g>

  <!-- RIGHT: 5x5 Polyomino Grid (414x414 centered vertically at y=93, within x=660 to 1074) -->
  <g transform="translate(660, 93)" filter="url(#boardShadow)">
    <!-- Outer Arcade Frame -->
    <rect x="0" y="0" width="414" height="414" rx="20" fill="#121224" stroke="#2A2A4E" stroke-width="3"/>
    <!-- Inner Bezel -->
    <rect x="8" y="8" width="398" height="398" rx="14" fill="#0A0A12" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.35"/>

    <!-- 5x5 Grid Cells (22px padding, 68px cell size, 6px gap => 370px total) -->
    <g transform="translate(22, 22)">
      <!-- Row 0 -->
      <!-- (0,0) Shape 3: Laser Cyan -->
      <rect x="0" y="0" width="68" height="68" rx="10" fill="url(#tileCyan)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (0,1) Shape 3: Laser Cyan -->
      <rect x="74" y="0" width="68" height="68" rx="10" fill="url(#tileCyan)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (0,2) Blocked Tile -->
      <rect x="148" y="0" width="68" height="68" rx="10" fill="#08080F" stroke="#1F2937" stroke-width="1.5"/>
      <line x1="162" y1="14" x2="202" y2="54" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="202" y1="14" x2="162" y2="54" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <!-- (0,3) Shape 1: Neon Orange -->
      <rect x="222" y="0" width="68" height="68" rx="10" fill="url(#tileOrange)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- (0,4) Shape 1: Neon Orange -->
      <rect x="296" y="0" width="68" height="68" rx="10" fill="url(#tileOrange)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>

      <!-- Row 1 -->
      <!-- (1,0) Shape 3: Laser Cyan -->
      <rect x="0" y="74" width="68" height="68" rx="10" fill="url(#tileCyan)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (1,1) Shape 2: Cyber Yellow -->
      <rect x="74" y="74" width="68" height="68" rx="10" fill="url(#tileYellow)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (1,2) Shape 2: Cyber Yellow -->
      <rect x="148" y="74" width="68" height="68" rx="10" fill="url(#tileYellow)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (1,3) Shape 2: Cyber Yellow -->
      <rect x="222" y="74" width="68" height="68" rx="10" fill="url(#tileYellow)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (1,4) Shape 1: Neon Orange -->
      <rect x="296" y="74" width="68" height="68" rx="10" fill="url(#tileOrange)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>

      <!-- Row 2 -->
      <!-- (2,0) Shape 5: Hot Magenta -->
      <rect x="0" y="148" width="68" height="68" rx="10" fill="url(#tileMagenta)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- (2,1) Shape 5: Hot Magenta -->
      <rect x="74" y="148" width="68" height="68" rx="10" fill="url(#tileMagenta)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- (2,2) Shape 2: Cyber Yellow -->
      <rect x="148" y="148" width="68" height="68" rx="10" fill="url(#tileYellow)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (2,3) Blocked Tile -->
      <rect x="222" y="148" width="68" height="68" rx="10" fill="#08080F" stroke="#1F2937" stroke-width="1.5"/>
      <line x1="236" y1="162" x2="276" y2="202" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="276" y1="162" x2="236" y2="202" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <!-- (2,4) Shape 6: Matrix Green -->
      <rect x="296" y="148" width="68" height="68" rx="10" fill="url(#tileGreen)" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Row 3 -->
      <!-- (3,0) Shape 5: Hot Magenta -->
      <rect x="0" y="222" width="68" height="68" rx="10" fill="url(#tileMagenta)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- (3,1) Blocked Tile -->
      <rect x="74" y="222" width="68" height="68" rx="10" fill="#08080F" stroke="#1F2937" stroke-width="1.5"/>
      <line x1="88" y1="236" x2="128" y2="276" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="128" y1="236" x2="88" y2="276" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <!-- (3,2) Shape 4: Ultraviolet -->
      <rect x="148" y="222" width="68" height="68" rx="10" fill="url(#tilePurple)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- (3,3) Shape 6: Matrix Green -->
      <rect x="222" y="222" width="68" height="68" rx="10" fill="url(#tileGreen)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- (3,4) Shape 6: Matrix Green -->
      <rect x="296" y="222" width="68" height="68" rx="10" fill="url(#tileGreen)" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Row 4 -->
      <!-- (4,0) Shape 5: Hot Magenta -->
      <rect x="0" y="296" width="68" height="68" rx="10" fill="url(#tileMagenta)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- (4,1) Shape 4: Ultraviolet -->
      <rect x="74" y="296" width="68" height="68" rx="10" fill="url(#tilePurple)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- (4,2) Shape 4: Ultraviolet -->
      <rect x="148" y="296" width="68" height="68" rx="10" fill="url(#tilePurple)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- (4,3) Shape 4: Ultraviolet -->
      <rect x="222" y="296" width="68" height="68" rx="10" fill="url(#tilePurple)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- (4,4) Blocked Tile -->
      <rect x="296" y="296" width="68" height="68" rx="10" fill="#08080F" stroke="#1F2937" stroke-width="1.5"/>
      <line x1="310" y1="310" x2="350" y2="350" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="350" y1="310" x2="310" y2="350" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

    </g>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1200" height="600" fill="url(#scanlines)" pointer-events="none"/>
</svg>
